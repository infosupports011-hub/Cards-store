<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WELCOME TO CARDS ZONES CLUB</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: #050b14 url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; font-family: Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .login-box {
            background: rgba(13, 22, 36, 0.95);
            border: 1px solid #1e3a5f; border-radius: 12px; padding: 25px;
            width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8); text-align: center;
        }
        .login-box h2 {
            color: #00ff66; font-size: 15px; margin-top: 0; margin-bottom: 15px;
            font-family: monospace; text-shadow: 0 0 10px rgba(0,255,102,0.5); text-transform: uppercase;
        }
        .tab-buttons { display: flex; margin-bottom: 20px; border-bottom: 1px solid #1c2541; }
        .tab-btn { flex: 1; background: none; border: none; color: #a0aec0; padding: 10px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .tab-btn.active { color: #00ff66; border-bottom: 2px solid #00ff66; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #a0aec0; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px; background-color: #0b132b; border: 1px solid #1c2541; color: #fff; border-radius: 6px; font-size: 13px; }
        .captcha-display { background-color: #050b14; border: 1px dashed #22b573; color: #00ff66; padding: 10px; font-size: 20px; font-weight: bold; letter-spacing: 6px; border-radius: 6px; margin: 8px 0; text-align: center; font-family: monospace; }
        .key-display { background-color: #050b14; border: 1px solid #ffb703; color: #ffb703; padding: 12px; font-size: 11px; font-weight: bold; border-radius: 6px; margin: 15px 0; word-break: break-all; font-family: monospace; }
        .btn { background-color: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; margin-top: 10px; }
        .btn:hover { background-color: #1557b0; }
        .error { background-color: rgba(217, 4, 41, 0.2); border: 1px solid #d90429; color: #ffb703; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>WELCOME TO CARD ZONE CLUB</h2>
        
        <div class="tab-buttons">
            <button class="tab-btn active" id="btn-login-tab" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="btn-signup-tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <div id="error-msg" class="error" style="display:none;"></div>

        <!-- LOGIN FORM -->
        <div id="login-section">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="login-name" class="form-control" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Gmail:</label>
                    <input type="email" id="login-email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>36-character Private Key:</label>
                    <input type="text" id="login-key" class="form-control" placeholder="Enter 36-char Private Key" required>
                </div>
                <button type="submit" class="btn">Login to Dashboard</button>
            </form>
        </div>

        <!-- SIGN UP FORM -->
        <div id="signup-section" style="display:none;">
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="signup-name" class="form-control" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="signup-username" class="form-control" placeholder="Choose username" required>
                </div>
                <div class="form-group">
                    <label>Gmail:</label>
                    <input type="email" id="signup-email" class="form-control" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>Captcha Code:</label>
                    <div id="captcha-code" class="captcha-display"></div>
                    <input type="text" id="captcha-input" class="form-control" placeholder="Enter code shown above" required>
                </div>
                <button type="submit" class="btn">Register Account</button>
            </form>
        </div>

        <!-- SUCCESS PRIVATE KEY DISPLAY -->
        <div id="success-section" style="display:none;">
            <p style="font-size: 13px; color: #38b000;"><b>Account Registered Successfully!</b></p>
            <p style="font-size: 12px; color: #adb5bd;">Save this 36-character Private Key securely to login later:</p>
            <div id="new-key-display" class="key-display"></div>
            <button onclick="window.location.href='store.html'" class="btn">Proceed to Store</button>
        </div>
    </div>

    <script>
        let currentCaptcha = '';

        function generateCaptcha() {
            const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz';
            let res = '';
            for (let i = 0; i < 4; i++) res += chars[Math.floor(Math.random() * chars.length)];
            currentCaptcha = res;
            const capEl = document.getElementById('captcha-code');
            if (capEl) capEl.innerText = res;
        }

        function generatePrivateKey() {
            const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let key = upper[Math.floor(Math.random() * upper.length)];
            for (let i = 0; i < 35; i++) key += chars[Math.floor(Math.random() * chars.length)];
            return key;
        }

        window.onload = function() {
            generateCaptcha();
        };

        function switchTab(tab) {
            document.getElementById('error-msg').style.display = 'none';
            if (tab === 'login') {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('signup-section').style.display = 'none';
                document.getElementById('success-section').style.display = 'none';
                document.getElementById('btn-login-tab').classList.add('active');
                document.getElementById('btn-signup-tab').classList.remove('active');
            } else {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('signup-section').style.display = 'block';
                document.getElementById('success-section').style.display = 'none';
                document.getElementById('btn-signup-tab').classList.add('active');
                document.getElementById('btn-login-tab').classList.remove('active');
                generateCaptcha();
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const username = document.getElementById('signup-username').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const captchaInput = document.getElementById('captcha-input').value.trim();
            const errorDiv = document.getElementById('error-msg');

            if (captchaInput !== currentCaptcha) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Invalid Captcha code. Please try again.";
                generateCaptcha();
                return;
            }

            let users = JSON.parse(localStorage.getItem('czc_users') || '[]');
            let existingUser = users.find(u => u.email === email || u.username === username);

            if (existingUser) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Username or Email already exists! Please login.";
                generateCaptcha();
                return;
            }

            const privateKey = generatePrivateKey();
            const newUser = { name, username, email, privateKey, is_activated: 0, balance_usd: 0.00 };
            users.push(newUser);
            localStorage.setItem('czc_users', JSON.stringify(users));
            localStorage.setItem('czc_current_user', username);

            document.getElementById('signup-section').style.display = 'none';
            document.querySelector('.tab-buttons').style.display = 'none';
            document.getElementById('success-section').style.display = 'block';
            document.getElementById('new-key-display').innerText = privateKey;
        }

        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('login-name').value.trim();
            const email = document.getElementById('login-email').value.trim();
            const enteredKey = document.getElementById('login-key').value.trim();
            const errorDiv = document.getElementById('error-msg');

            let users = JSON.parse(localStorage.getItem('czc_users') || '[]');
            let user = users.find(u => u.name.toLowerCase() === name.toLowerCase() && u.email.toLowerCase() === email.toLowerCase() && u.privateKey === enteredKey);

            if (user) {
                localStorage.setItem('czc_current_user', user.username);
                window.location.href = 'store.html';
            } else {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Invalid Name, Email or Private Key! Access Denied.";
            }
        }
    </script>
</body>
</html>
