<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏴‍☠️ Cards Zones Club 🏴‍☠️ - Secure Gateway</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050b14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        /* सर्किट और मैट्रिक्स वाला बैकग्राउंड इफ़ेक्ट */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(5,11,20,0.85), rgba(5,11,20,0.95)), 
                        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,255,100,0.03) 40px, rgba(0,255,100,0.03) 41px),
                        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,150,255,0.03) 40px, rgba(0,150,255,0.03) 41px);
            z-index: 1;
        }
        .auth-container {
            position: relative;
            z-index: 2;
            background-color: rgba(17, 24, 39, 0.95);
            border: 1px solid #1e3a8a;
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
        h2 {
            color: #4ade80;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: #9ca3af;
            font-family: monospace;
        }
        input {
            width: 100%;
            padding: 9px 12px;
            background: #0b132b;
            border: 1px solid #1d4ed8;
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        input:focus {
            border-color: #4ade80;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: #fff;
            padding: 11px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .switch-text {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #9ca3af;
            cursor: pointer;
        }
        .switch-text span {
            color: #4ade80;
            font-weight: bold;
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
            text-align: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #111827;
            border: 1px solid #4ade80;
            padding: 25px;
            border-radius: 8px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .private-key-box {
            background: #0b132b;
            border: 1px dashed #4ade80;
            color: #4ade80;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            margin: 15px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-box">
        <h2 id="form-title">🏴‍☠️ Cards Zones Club 🏴‍☠️</h2>
        <div id="error-alert" class="error-msg"></div>

        <div id="login-form">
            <div class="form-group">
                <label>Username / Email:</label>
                <input type="text" id="login-user" placeholder="Enter username or email" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password / Private Key:</label>
                <input type="password" id="login-pass" placeholder="Enter password or 36-digit key" autocomplete="off">
            </div>
            <button onclick="handleLogin()">Verify & Continue</button>
            <div class="switch-text" onclick="toggleAuthMode()">Don't have an account? <span>Sign Up</span></div>
        </div>

        <div id="signup-form" style="display:none;">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="signup-name" placeholder="Alexander Hamilton" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="signup-user" placeholder="Choose username" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Gmail:</label>
                <input type="email" id="signup-email" placeholder="hellokitty11@gmail.com" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="signup-pass" placeholder="Create password" autocomplete="off">
            </div>
            <button onclick="handleSignup()">Create Secure Account</button>
            <div class="switch-text" onclick="toggleAuthMode()">Already have an account? <span>Log In</span></div>
        </div>
    </div>

    <div class="modal" id="key-modal">
        <div class="modal-content">
            <h3 style="color: #4ade80; margin-top:0;">⚠️ Save Your Private Key!</h3>
            <p style="font-size: 13px; color: #9ca3af;">यह आपकी 36-डिजिट की प्राइवेट की है। इसे सुरक्षित जगह सेव कर लें, इसी से आपका अकाउंट पहचाना जाएगा। अगर यह खो गई तो अकाउंट रिकवर नहीं होगा!</p>
            <div class="private-key-box" id="display-private-key"></div>
            <button onclick="proceedToStore()">I have saved it, Continue</button>
        </div>
    </div>

    <script>
        function initializeDefaultAccounts() {
            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch (e) { users = []; }

            const defaultAccounts = [
                {
                    name: 'Alexander Hamilton',
                    username: 'alexander_hamilton',
                    email: 'hellokitty11@gmail.com',
                    password: 'Alex Devil',
                    privateKey: 'VuRtuzLP48MJThDB03Mudvm5B1Tj9Naokk9s',
                    balance_usd: 5000.00,
                    role: 'Owner'
                },
                {
                    name: 'Williams',
                    username: 'williams',
                    email: 'williams39@gmail.com',
                    password: 'Willams123',
                    privateKey: 'CZCWILLIAMS9876543210abcdefABCDEF123',
                    balance_usd: 1500.00,
                    role: 'Personal Assistant'
                },
                {
                    name: 'Nexus Vendor',
                    username: 'nexus_vendor',
                    email: 'nexus_vendor@czc.club',
                    password: 'seller123_d',
                    privateKey: 'CZCGEAR9876543210abcdefABCDEF123454',
                    balance_usd: 1000.00,
                    role: 'Vendor'
                },
                {
                    name: 'Matrix Node',
                    username: 'matrix_node',
                    email: 'matrix_node@czc.club',
                    password: 'seller123_c',
                    privateKey: 'CZCGEAR9876543210abcdefABCDEF123453',
                    balance_usd: 1000.00,
                    role: 'Vendor'
                },
                {
                    name: 'Admin',
                    username: 'admin',
                    email: 'treasurerman89@gmail.com',
                    password: 'admin201215',
                    privateKey: 'CZCADMIN9876543210abcdefABCDEF123456',
                    balance_usd: 5000.00,
                    role: 'Owner'
                },
                {
                    name: 'Shadow Seller',
                    username: 'shadow_seller',
                    email: 'shadow_seller@czc.club',
                    password: 'seller123_a',
                    privateKey: 'CZCGEAR9876543210abcdefABCDEF123451',
                    balance_usd: 1000.00,
                    role: 'Seller'
                },
                {
                    name: 'Viper Cards',
                    username: 'viper_cards',
                    email: 'viper_cards@czc.club',
                    password: 'seller123_b',
                    privateKey: 'CZCGEAR9876543210abcdefABCDEF123452',
                    balance_usd: 1000.00,
                    role: 'Seller'
                },
                {
                    name: 'Phantom Store',
                    username: 'phantom_store',
                    email: 'phantom@czc.club',
                    password: 'seller123_g',
                    privateKey: 'CZCGEAR9876543210abcdefABCDEF123457',
                    balance_usd: 1000.00,
                    role: 'Vendor'
                },
                {
                    name: 'Apex Vendor',
                    username: 'apex_vendor',
                    email: 'apex@czc.club',
                    password: 'seller123_h',
                    privateKey: 'CZCGEAR9876543210abcdefABCDEF123458',
                    balance_usd: 1000.00,
                    role: 'Vendor'
                },
                {
                    name: 'Zenith Merchant',
                    username: 'zenith_merchant',
                    email: 'zenith@czc.club',
                    password: 'seller123_i',
                    privateKey: 'CZCGEAR9876543210abcdefABCDEF123459',
                    balance_usd: 1000.00,
                    role: 'Merchant'
                }
            ];

            defaultAccounts.forEach(acc => {
                let index = users.findIndex(u => u.username.toLowerCase() === acc.username.toLowerCase());
                if (index === -1) {
                    users.push(acc);
                } else {
                    users[index].password = acc.password;
                    users[index].privateKey = acc.privateKey;
                    users[index].email = acc.email;
                    users[index].role = acc.role;
                }
            });

            localStorage.setItem('czc_users', JSON.stringify(users));
        }

        window.onload = function() {
            initializeDefaultAccounts();
        };

        function generate36DigitKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 36; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function toggleAuthMode() {
            let loginForm = document.getElementById('login-form');
            let signupForm = document.getElementById('signup-form');
            let title = document.getElementById('form-title');
            let err = document.getElementById('error-alert');
            err.style.display = 'none';

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                title.innerText = '🏴‍☠️ Cards Zones Club 🏴‍☠️';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                title.innerText = 'CREATE NEW ACCOUNT';
            }
        }

        function showAlert(msg) {
            let err = document.getElementById('error-alert');
            err.innerText = msg;
            err.style.display = 'block';
        }

        function handleSignup() {
            let nameInp = document.getElementById('signup-name').value.trim();
            let userInp = document.getElementById('signup-user').value.trim();
            let emailInp = document.getElementById('signup-email').value.trim();
            let passInp = document.getElementById('signup-pass').value.trim();

            if (!nameInp || !userInp || !emailInp || !passInp) {
                showAlert('Please fill in all fields.');
                return;
            }

            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch (e) { users = []; }

            if (users.some(u => u.username.toLowerCase() === userInp.toLowerCase())) {
                showAlert('Username already taken.');
                return;
            }

            let privateKey = generate36DigitKey();

            let newUser = {
                name: nameInp,
                username: userInp,
                email: emailInp,
                password: passInp,
                privateKey: privateKey,
                balance_usd: 0.00,
                role: 'Member'
            };

            users.push(newUser);
            localStorage.setItem('czc_users', JSON.stringify(users));
            localStorage.setItem('czc_current_user', newUser.username);

            document.getElementById('display-private-key').innerText = privateKey;
            document.getElementById('key-modal').style.display = 'flex';
        }

        function proceedToStore() {
            window.location.href = 'store.html';
        }

        function handleLogin() {
            let userInp = document.getElementById('login-user').value.trim();
            let passInp = document.getElementById('login-pass').value.trim();

            if (!userInp || !passInp) {
                showAlert('Please fill in all fields.');
                return;
            }

            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch (e) { users = []; }

            let found = users.find(u => 
                (u.username.toLowerCase() === userInp.toLowerCase() || u.email.toLowerCase() === userInp.toLowerCase()) && 
                (u.password === passInp || u.privateKey === passInp)
            );

            if (found) {
                localStorage.setItem('czc_current_user', found.username);
                window.location.href = 'store.html';
            } else {
                showAlert('Invalid username/email or password/private key.');
            }
        }
    </script>
</body>
</html>
