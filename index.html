<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Zones Club - Secure Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0d1b2a; color: #ffffff; font-family: Arial, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background-color: #1b263b; border: 1px solid #415a77; border-radius: 10px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .logo-container { 
            text-align: center; 
            margin-bottom: 20px; 
            overflow: hidden; 
            height: 85px; 
            background: transparent;
        }
        .logo-container img { 
            width: 155%; 
            max-width: none; 
            margin-top: -34px; 
            margin-left: -27%; 
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        h2 { color: #38b000; text-align: center; margin-top: 0; font-size: 20px; letter-spacing: 1px; }
        .error-box { background-color: rgba(217,4,41,0.2); border: 1px solid #d90429; color: #ff4d4d; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 12px; display: none; text-align: center; }
        label { font-size: 13px; color: #adb5bd; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #0d1b2a; border: 1px solid #415a77; color: #fff; border-radius: 4px; font-size: 13px; }
        
        /* Hard & Secure Hard-Style Captcha Canvas Box */
        .captcha-box-wrapper {
            position: relative;
            width: 100%;
            margin: 5px 0 15px 0;
            background: #0d1b2a;
            border: 1px solid #415a77;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            text-align: center;
        }
        #captcha-canvas {
            display: block;
            width: 100%;
            height: 45px;
            background: #111a28;
        }
        .captcha-hint {
            font-size: 10px;
            color: #8d99ae;
            padding: 3px;
            background: #0b131a;
            border-top: 1px solid #233142;
        }

        .btn-submit { background-color: #38b000; color: #fff; padding: 12px; border: none; border-radius: 6px; width: 100%; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #2e9000; }
        .btn-submit:disabled { background-color: #415a77; cursor: not-allowed; }
        .signup-link { text-align: center; margin-top: 15px; font-size: 12px; color: #adb5bd; }
        .signup-link a { color: #38b000; text-decoration: none; font-weight: bold; }
        .step-hidden { display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-container">
            <img src="https://i.postimg.cc/zBkBgr6C/1793257012618.jpg" alt="Cards Zones Club Logo">
        </div>
        
        <div id="error-msg" class="error-box">Invalid credentials or security mismatch.</div>

        <!-- STEP 1: Username, Password & Hard Canvas Captcha -->
        <div id="login-step-1">
            <label>Username or Gmail:</label>
            <input type="text" id="login-username" placeholder="Enter username or gmail" autocomplete="off">

            <label>Password:</label>
            <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">

            <label>Security Captcha Verification:</label>
            <div class="captcha-box-wrapper" onclick="generateHardCaptcha()" title="Click to refresh captcha">
                <canvas id="captcha-canvas"></canvas>
                <div class="captcha-hint">Click image to reload hard captcha</div>
            </div>
            <input type="text" id="captcha-input" placeholder="Enter exact characters shown above" autocomplete="off">

            <button onclick="proceedToStepTwo()" class="btn-submit">Next: Private Key Verification</button>

            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>

        <!-- STEP 2: Only 36-Digit Private Key -->
        <div id="login-step-2" class="step-hidden">
            <label>36-Digit Private Key:</label>
            <input type="password" id="login-privkey" placeholder="Enter 36-digit private key" autocomplete="new-password">

            <button id="login-btn" onclick="handleLogin()" class="btn-submit">Secure Verify & Continue</button>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" onclick="backToStepOne()" style="color: #adb5bd; font-size: 12px; text-decoration: underline;">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        let currentCaptchaText = "";
        let failedAttempts = 0;
        let lockoutTimer = null;
        let tempVerifiedUser = null;

        function initializeDefaultUsers() {
            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch(e) { users = []; }

            let adminIndex = users.findIndex(u => u.username && u.username.toLowerCase() === 'admin');
            let adminData = {
                name: 'System Administrator',
                username: 'admin',
                email: 'treasurerman89@gmail.com',
                password: 'admin201215',
                privateKey: 'CZCADMIN9876543210abcdefABCDEF123456',
                balance_usd: 99999.00,
                total_deposited: 5000.00,
                is_activated: 1,
                role: 'Owner',
                tfaEnabled: false,
                emailVerified: true,
                activationDate: new Date().toISOString()
            };

            if (adminIndex === -1) {
                users.push(adminData);
            } else {
                users[adminIndex].password = 'admin201215';
                users[adminIndex].privateKey = 'CZCADMIN9876543210abcdefABCDEF123456';
                users[adminIndex].email = 'treasurerman89@gmail.com';
                users[adminIndex].role = 'Owner';
                users[adminIndex].is_activated = 1;
            }

            let alexIndex = users.findIndex(u => u.username && u.username.toLowerCase() === 'alexander hamilton');
            let alexData = {
                name: 'Alexander Hamilton',
                username: 'Alexander Hamilton',
                password: 'Alex Devil',
                email: 'hellokitty11@gmail.com',
                privateKey: 'VuRtuzLP48MJThDB03Mudvm5B1Tj9Naokk9s',
                balance_usd: 100.00,
                total_deposited: 30.00,
                is_activated: 1,
                role: 'Official Seller',
                tfaEnabled: false,
                emailVerified: true,
                activationDate: new Date().toISOString()
            };

            if (alexIndex === -1) {
                users.push(alexData);
            } else {
                users[alexIndex].password = 'Alex Devil';
                users[alexIndex].privateKey = 'VuRtuzLP48MJThDB03Mudvm5B1Tj9Naokk9s';
                users[alexIndex].email = 'hellokitty11@gmail.com';
                users[alexIndex].role = 'Official Seller';
                users[alexIndex].is_activated = 1;
            }

            localStorage.setItem('czc_users', JSON.stringify(users));
        }

        function generateHardCaptcha() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
            let captcha = "";
            for (let i = 0; i < 6; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptchaText = captcha;
            
            let canvas = document.getElementById('captcha-canvas');
            if (!canvas) return;
            let ctx = canvas.getContext('2d');
            
            canvas.width = canvas.offsetWidth || 300;
            canvas.height = 45;

            // Background fill with dark texture feel
            ctx.fillStyle = "#0d1b2a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw disturbing lines (Hard obstacle lines)
            for (let i = 0; i < 7; i++) {
                ctx.strokeStyle = `rgba(${Math.floor(Math.random()*150+50)}, ${Math.floor(Math.random()*150+50)}, ${Math.floor(Math.random()*255)}, 0.6)`;
                ctx.lineWidth = Math.random() * 2 + 1;
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.stroke();
            }

            // Draw noise dots
            for (let i = 0; i < 40; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
            }

            // Draw twisted / styled text characters
            ctx.font = "bold 24px monospace";
            ctx.textBaseline = "middle";
            
            let charSpacing = canvas.width / (captcha.length + 1);
            for (let i = 0; i < captcha.length; i++) {
                ctx.save();
                let x = charSpacing * (i + 1) + (Math.random() * 10 - 5);
                let y = canvas.height / 2 + (Math.random() * 10 - 5);
                ctx.translate(x, y);
                
                let angle = (Math.random() * 0.4) - 0.2;
                ctx.rotate(angle);
                
                ctx.fillStyle = i % 2 === 0 ? "#ffb703" : "#48cae4";
                ctx.fillText(captcha[i], -10, 0);
                ctx.restore();
            }

            document.getElementById('captcha-input').value = '';
        }

        function triggerLockout() {
            failedAttempts = 0;
            let btn = document.getElementById('login-btn');
            let errorBox = document.getElementById('error-msg');
            btn.disabled = true;
            let seconds = 30;
            
            errorBox.innerText = `Too many failed attempts. Security lockout active for ${seconds}s.`;
            errorBox.style.display = 'block';

            lockoutTimer = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    errorBox.innerText = `Security lockout active for ${seconds}s.`;
                } else {
                    clearInterval(lockoutTimer);
                    btn.disabled = false;
                    errorBox.style.display = 'none';
                    generateHardCaptcha();
                }
            }, 1000);
        }

        function proceedToStepTwo() {
            let errorBox = document.getElementById('error-msg');
            let usernameInput = document.getElementById('login-username').value.trim();
            let passwordInput = document.getElementById('login-password').value.trim();
            let captchaInput = document.getElementById('captcha-input').value.trim();

            if (!usernameInput || !passwordInput || !captchaInput) {
                errorBox.innerText = "Please fill in all fields including Captcha.";
                errorBox.style.display = 'block';
                return;
            }

            if (captchaInput !== currentCaptchaText) {
                failedAttempts++;
                errorBox.innerText = "Invalid Captcha code. Hard captcha automatically refreshed.";
                errorBox.style.display = 'block';
                generateHardCaptcha();
                if (failedAttempts >= 4) { triggerLockout(); }
                return;
            }

            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch(e) { users = []; }

            let user = users.find(u => 
                (u.username && u.username.toLowerCase() === usernameInput.toLowerCase()) || 
                (u.email && u.email.toLowerCase() === usernameInput.toLowerCase())
            );

            if (!user || user.password !== passwordInput) {
                failedAttempts++;
                errorBox.innerText = "Invalid username/gmail or password. Captcha refreshed.";
                errorBox.style.display = 'block';
                generateHardCaptcha();
                if (failedAttempts >= 4) { triggerLockout(); }
                return;
            }

            tempVerifiedUser = user;
            errorBox.style.display = 'none';

            document.getElementById('login-step-1').classList.add('step-hidden');
            document.getElementById('login-step-2').classList.remove('step-hidden');
        }

        function backToStepOne() {
            document.getElementById('login-step-2').classList.add('step-hidden');
            document.getElementById('login-step-1').classList.remove('step-hidden');
            document.getElementById('error-msg').style.display = 'none';
            tempVerifiedUser = null;
            generateHardCaptcha();
        }

        function handleLogin() {
            let errorBox = document.getElementById('error-msg');
            if (lockoutTimer) return;

            let privKey = document.getElementById('login-privkey').value.trim();

            if (!privKey) {
                errorBox.innerText = "Private Key is required.";
                errorBox.style.display = 'block';
                return;
            }

            if (!tempVerifiedUser || tempVerifiedUser.privateKey !== privKey) {
                failedAttempts++;
                errorBox.innerText = "Invalid Private Key. Access denied.";
                errorBox.style.display = 'block';
                if (failedAttempts >= 4) { triggerLockout(); }
                return;
            }

            let userKey = tempVerifiedUser.username.toLowerCase();
            let newSessionToken = 'sess_' + Math.random().toString(36).substring(2) + Date.now().toString(36);

            let activeSessions = {};
            try { activeSessions = JSON.parse(localStorage.getItem('czc_active_sessions') || '{}'); } catch(e) {}
            
            activeSessions[userKey] = {
                token: newSessionToken,
                time: Date.now()
            };
            localStorage.setItem('czc_active_sessions', JSON.stringify(activeSessions));
            
            localStorage.setItem('czc_local_session_token', newSessionToken);
            localStorage.setItem('czc_current_user', tempVerifiedUser.username);

            window.location.href = 'store.html';
        }

        window.onload = function() {
            initializeDefaultUsers();
            generateHardCaptcha();
        };
    </script>
</body>
</html>
