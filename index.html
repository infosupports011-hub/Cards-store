<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏴‍☠️ Cards Zones Club 🏴‍☠️ - Secure Gateway</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050b14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(5,11,20,0.85), rgba(5,11,20,0.95)), 
                        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,255,100,0.03) 40px, rgba(0,255,100,0.03) 41px),
                        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,150,255,0.03) 40px, rgba(0,150,255,0.03) 41px);
            z-index: 1;
        }
        .auth-container {
            position: relative;
            z-index: 2;
            background-color: rgba(17, 24, 39, 0.95);
            border: 1px solid #1e3a8a;
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
        h2 {
            color: #4ade80;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: #9ca3af;
            font-family: monospace;
        }
        input {
            width: 100%;
            padding: 9px 12px;
            background: #0b132b;
            border: 1px solid #1d4ed8;
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        input:focus {
            border-color: #4ade80;
        }
        .captcha-box-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .captcha-display {
            background: #0b132b;
            border: 1px dashed #4ade80;
            color: #facc15;
            padding: 8px 15px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            border-radius: 4px;
            user-select: none;
            text-align: center;
            flex-grow: 1;
        }
        .refresh-captcha {
            background: #1d4ed8;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-top: 0 !important;
        }
        .refresh-captcha:hover {
            background: #2563eb;
        }
        button.action-btn {
            width: 100%;
            background-color: #2563eb;
            color: #fff;
            padding: 11px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button.action-btn:hover {
            background-color: #1d4ed8;
        }
        .switch-text {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #9ca3af;
            cursor: pointer;
        }
        .switch-text span {
            color: #4ade80;
            font-weight: bold;
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
            text-align: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #111827;
            border: 1px solid #4ade80;
            padding: 25px;
            border-radius: 8px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .private-key-box {
            background: #0b132b;
            border: 1px dashed #4ade80;
            color: #4ade80;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            margin: 15px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-box">
        <h2 id="form-title">🏴‍☠️ Cards Zones Club 🏴‍☠️</h2>
        <div id="error-alert" class="error-msg"></div>

        <!-- Login Form -->
        <div id="login-form">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="login-user" placeholder="Enter username" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="login-pass" placeholder="Enter password" autocomplete="off">
            </div>
            <div class="form-group">
                <label>36-Digit Private Key:</label>
                <input type="password" id="login-key" placeholder="Enter 36-digit private key" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Captcha Verification:</label>
                <div class="captcha-box-container">
                    <div class="captcha-display" id="login-captcha-code">5938</div>
                    <button type="button" class="refresh-captcha" onclick="refreshCaptcha('login')">🔄</button>
                </div>
                <input type="text" id="login-captcha-input" placeholder="Enter captcha code" autocomplete="off">
            </div>
            <button class="action-btn" onclick="handleLogin()">Verify & Continue</button>
            <div class="switch-text" onclick="toggleAuthMode()">Don't have an account? <span>Sign Up</span></div>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" style="display:none;">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="signup-name" placeholder="Enter your name" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="signup-user" placeholder="Enter username" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Gmail:</label>
                <input type="email" id="signup-email" placeholder="Enter your email" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="signup-pass" placeholder="Enter password" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Captcha Verification:</label>
                <div class="captcha-box-container">
                    <div class="captcha-display" id="signup-captcha-code">7124</div>
                    <button type="button" class="refresh-captcha" onclick="refreshCaptcha('signup')">🔄</button>
                </div>
                <input type="text" id="signup-captcha-input" placeholder="Enter captcha code" autocomplete="off">
            </div>
            <button class="action-btn" onclick="handleSignup()">Create Secure Account</button>
            <div class="switch-text" onclick="toggleAuthMode()">Already have an account? <span>Log In</span></div>
        </div>
    </div>

    <!-- Private Key Modal -->
    <div class="modal" id="key-modal">
        <div class="modal-content">
            <h3 style="color: #4ade80; margin-top:0;">⚠️ Save Your Private Key!</h3>
            <p style="font-size: 13px; color: #9ca3af;">यह आपकी 36-डिजिट की प्राइवेट की है। इसे सुरक्षित जगह सेव कर लें, इसी से आपका अकाउंट पहचाना जाएगा। अगर यह खो गई तो अकाउंट रिकवर नहीं होगा!</p>
            <div class="private-key-box" id="display-private-key"></div>
            <button class="action-btn" onclick="proceedToStore()">I have saved it, Continue</button>
        </div>
    </div>

    <script>
        let currentLoginCaptcha = "";
        let currentSignupCaptcha = "";

        function generateRandomCaptcha() {
            const options = [
                () => { let a = Math.floor(Math.random() * 10) + 1; let b = Math.floor(Math.random() * 10) + 1; return { text: `${a} + ${b}`, ans: String(a + b) }; },
                () => { let a = Math.floor(Math.random() * 10) + 5; let b = Math.floor(Math.random() * 5) + 1; return { text: `${a} - ${b}`, ans: String(a - b) }; },
                () => { const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; let res = ''; for(let i=0; i<4; i++) res += chars.charAt(Math.floor(Math.random()*chars.length)); return { text: res, ans: res }; }
            ];
            let chosen = options[Math.floor(Math.random() * options.length)]();
            return chosen;
        }

        function refreshCaptcha(type) {
            if (type === 'login') {
                let cap = generateRandomCaptcha();
                currentLoginCaptcha = cap.ans;
                document.getElementById('login-captcha-code').innerText = cap.text;
                document.getElementById('login-captcha-input').value = '';
            } else {
                let cap = generateRandomCaptcha();
                currentSignupCaptcha = cap.ans;
                document.getElementById('signup-captcha-code').innerText = cap.text;
                document.getElementById('signup-captcha-input').value = '';
            }
        }

        function initializeDefaultAccounts() {

                {

                },
                {

                {

                {

                },
                {

                },
                {
                    name: 'Viper Cards',
                    username: 'viper_cards',
                    email: 'viper_cards@czc.club',

                    role: 'Seller'
                },
                {
                    name: 'Phantom Store',
                    username: 'phantom_store',
                    email: 'phantom@czc.club',
                    password: 'seller123_g',
                    privateKey: 'CZCGEAR9876543210abcdefABCDEF123457',
                    balance_usd: 1000.00,

                },
                {
                    name: 'Apex Vendor',
                    username: 'apex_vendor',
                    email: 'apex@czc.club',

                },
                {

                    username: 'zenith_merchant',
                    email: 'zenith@czc.club',

            defaultAccounts.forEach(acc => {
                let index = users.findIndex(u => u.username.toLowerCase() === acc.username.toLowerCase());
                if (index === -1) {
                    users.push(acc);
                } else {
                    users[index].password = acc.password;
                    users[index].privateKey = acc.privateKey;
                    users[index].email = acc.email;
                    users[index].role = acc.role;
                }
            });

            localStorage.setItem('czc_users', JSON.stringify(users));
        }

        window.onload = function() {
            initializeDefaultAccounts();
            refreshCaptcha('login');
            refreshCaptcha('signup');
        };

        function generate36DigitKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 36; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function toggleAuthMode() {
            let loginForm = document.getElementById('login-form');
            let signupForm = document.getElementById('signup-form');
            let title = document.getElementById('form-title');
            let err = document.getElementById('error-alert');
            err.style.display = 'none';

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                title.innerText = '🏴‍☠️ Cards Zones Club 🏴‍☠️';
                refreshCaptcha('login');
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                title.innerText = 'CREATE NEW ACCOUNT';
                refreshCaptcha('signup');
            }
        }

        function showAlert(msg) {
            let err = document.getElementById('error-alert');
            err.innerText = msg;
            err.style.display = 'block';
        }

        function handleSignup() {
            let nameInp = document.getElementById('signup-name').value.trim();
            let userInp = document.getElementById('signup-user').value.trim();
            let emailInp = document.getElementById('signup-email').value.trim();
            let passInp = document.getElementById('signup-pass').value.trim();
            let captchaInp = document.getElementById('signup-captcha-input').value.trim();

            if (!nameInp || !userInp || !emailInp || !passInp || !captchaInp) {
                showAlert('Please fill in all fields including captcha.');
                refreshCaptcha('signup');
                return;
            }

            if (captchaInp !== currentSignupCaptcha) {
                showAlert('Invalid Captcha Code. A new captcha has been generated.');
                refreshCaptcha('signup');
                return;
            }

            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch (e) { users = []; }

            if (users.some(u => u.username.toLowerCase() === userInp.toLowerCase())) {
                showAlert('Username already taken.');
                refreshCaptcha('signup');
                return;
            }

            let privateKey = generate36DigitKey();

            let newUser = {
                name: nameInp,
                username: userInp,
                email: emailInp,
                password: passInp,
                privateKey: privateKey,
                balance_usd: 0.00,
                role: 'Member'
            };

            users.push(newUser);
            localStorage.setItem('czc_users', JSON.stringify(users));
            localStorage.setItem('czc_current_user', newUser.username);

            document.getElementById('display-private-key').innerText = privateKey;
            document.getElementById('key-modal').style.display = 'flex';
        }

        function proceedToStore() {
            window.location.href = 'store.html';
        }

        function handleLogin() {
            let userInp = document.getElementById('login-user').value.trim();
            let passInp = document.getElementById('login-pass').value.trim();
            let keyInp = document.getElementById('login-key').value.trim();
            let captchaInp = document.getElementById('login-captcha-input').value.trim();

            if (!userInp || !passInp || !keyInp || !captchaInp) {
                showAlert('Please fill in all fields including captcha.');
                refreshCaptcha('login');
                return;
            }

            if (captchaInp !== currentLoginCaptcha) {
                showAlert('Invalid Captcha Code. A new captcha has been generated.');
                refreshCaptcha('login');
                return;
            }

            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch (e) { users = []; }

            let found = users.find(u => 
                u.username.toLowerCase() === userInp.toLowerCase() && 
                u.password === passInp && 
                u.privateKey === keyInp
            );

            if (found) {
                localStorage.setItem('czc_current_user', found.username);
                window.location.href = 'store.html';
            } else {
                showAlert('Invalid username, password, or private key. Captcha renewed.');
                refreshCaptcha('login');
            }
        }
    </script>
</body>
</html>
