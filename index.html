<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WELCOME TO CARD ZONE CLUB</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: #050b14 url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; font-family: Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .login-box {
            background: rgba(13, 22, 36, 0.95);
            border: 1px solid #1e3a5f; border-radius: 12px; padding: 25px;
            width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8); text-align: center;
        }
        .login-box h2 {
            color: #00ff66; font-size: 15px; margin-top: 0; margin-bottom: 20px;
            font-family: monospace; text-shadow: 0 0 10px rgba(0,255,102,0.5); text-transform: uppercase;
        }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #a0aec0; margin-bottom: 4px; }
        .form-control {
            width: 100%; padding: 10px; background-color: #0b132b;
            border: 1px solid #1c2541; color: #fff; border-radius: 6px; font-size: 13px;
        }
        .captcha-display {
            background-color: #050b14; border: 1px dashed #22b573;
            color: #00ff66; padding: 10px; font-size: 20px; font-weight: bold;
            letter-spacing: 6px; border-radius: 6px; margin: 8px 0; text-align: center; font-family: monospace;
        }
        .key-display {
            background-color: #050b14; border: 1px solid #ffb703;
            color: #ffb703; padding: 12px; font-size: 11px; font-weight: bold;
            border-radius: 6px; margin: 15px 0; word-break: break-all; font-family: monospace;
        }
        .btn {
            background-color: #1a73e8; color: white; border: none;
            padding: 12px; border-radius: 6px; cursor: pointer; width: 100%;
            font-weight: bold; font-size: 14px; margin-top: 10px;
        }
        .btn:hover { background-color: #1557b0; }
        .error {
            background-color: rgba(217, 4, 41, 0.2); border: 1px solid #d90429;
            color: #ffb703; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 12px;
        }
        .nav-links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 13px; }
        .nav-links a { color: #38b000; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>WELCOME TO CARD ZONE CLUB</h2>
        <div id="error-msg" class="error" style="display:none;"></div>

        <div id="step1-container">
            <form onsubmit="handleStep1(event)">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Gmail:</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Captcha Code:</label>
                    <div id="captcha-code" class="captcha-display"></div>
                    <input type="text" id="captcha-input" class="form-control" placeholder="Enter code shown above" required>
                </div>
                <button type="submit" class="btn">Verify & Continue</button>
            </form>
            <div class="nav-links">
                <a href="store.html">Buyer Store</a>
                <a href="seller.html">Seller Portal →</a>
            </div>
        </div>

        <div id="step2-container" style="display:none;">
            <p style="font-size: 13px; color: #adb5bd;">Account found! Enter your <b>36-character Private Key</b> to login:</p>
            <form onsubmit="handleStep2(event)">
                <div class="form-group">
                    <input type="text" id="entered-key" class="form-control" placeholder="Enter 36-char Private Key" required>
                </div>
                <button type="submit" class="btn">Login to Dashboard</button>
            </form>
        </div>

        <div id="step3-container" style="display:none;">
            <p style="font-size: 13px; color: #38b000;"><b>Account Registered Successfully!</b></p>
            <p style="font-size: 12px; color: #adb5bd;">Save this 36-character Private Key securely:</p>
            <div id="new-key-display" class="key-display"></div>
            <button onclick="window.location.href='store.html'" class="btn">Proceed to Store</button>
        </div>
    </div>

    <script>
        let currentCaptcha = '';
        function generateCaptcha() {
            const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz';
            let res = '';
            for (let i = 0; i < 4; i++) res += chars[Math.floor(Math.random() * chars.length)];
            currentCaptcha = res;
            document.getElementById('captcha-code').innerText = res;
        }
        function generatePrivateKey() {
            const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let key = upper[Math.floor(Math.random() * upper.length)];
            for (let i = 0; i < 35; i++) key += chars[Math.floor(Math.random() * chars.length)];
            return key;
        }
        window.onload = generateCaptcha;

        function handleStep1(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const captchaInput = document.getElementById('captcha-input').value.trim();
            const errorDiv = document.getElementById('error-msg');

            if (captchaInput !== currentCaptcha) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Invalid Captcha code. Please try again.";
                generateCaptcha();
                return;
            }

            let users = JSON.parse(localStorage.getItem('czc_users') || '[]');
            let existingUser = users.find(u => u.email === email || u.username === username);

            if (existingUser) {
                localStorage.setItem('czc_pending_user', existingUser.username);
                document.getElementById('step1-container').style.display = 'none';
                document.getElementById('step2-container').style.display = 'block';
            } else {
                const privateKey = generatePrivateKey();
                const newUser = { name, username, email, privateKey, is_activated: 0, balance_usd: 0.00 };
                users.push(newUser);
                localStorage.setItem('czc_users', JSON.stringify(users));
                localStorage.setItem('czc_current_user', username);

                document.getElementById('step1-container').style.display = 'none';
                document.getElementById('step3-container').style.display = 'block';
                document.getElementById('new-key-display').innerText = privateKey;
            }
        }

        function handleStep2(e) {
            e.preventDefault();
            const enteredKey = document.getElementById('entered-key').value.trim();
            const pendingUsername = localStorage.getItem('czc_pending_user');
            let users = JSON.parse(localStorage.getItem('czc_users') || '[]');
            let user = users.find(u => u.username === pendingUsername && u.privateKey === enteredKey);

            if (user) {
                localStorage.setItem('czc_current_user', user.username);
                window.location.href = 'store.html';
            } else {
                const errorDiv = document.getElementById('error-msg');
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Invalid Private Key! Access Denied.";
            }
        }
    </script>
</body>
</html>
