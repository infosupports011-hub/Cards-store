<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏴‍☠️Cards Zones Club🏴‍☠️ - Login</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0d1b2a; color: #ffffff; font-family: Arial, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background-color: #1b263b; border: 1px solid #415a77; border-radius: 10px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #38b000; text-align: center; margin-top: 0; font-size: 20px; }
        .error-box { background-color: rgba(217,4,41,0.2); border: 1px solid #d90429; color: #ff4d4d; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 12px; display: none; text-align: center; }
        label { font-size: 13px; color: #adb5bd; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #0d1b2a; border: 1px solid #415a77; color: #fff; border-radius: 4px; font-size: 13px; }
        .captcha-container { display: flex; align-items: center; gap: 10px; background: #0d1b2a; border: 1px solid #415a77; padding: 8px; border-radius: 4px; margin-bottom: 15px; justify-content: center; font-weight: bold; color: #ffb703; font-size: 16px; }
        .btn-refresh { background: #0077b6; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-submit { background-color: #38b000; color: #fff; padding: 12px; border: none; border-radius: 6px; width: 100%; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #2e9000; }
        .signup-link { text-align: center; margin-top: 15px; font-size: 12px; color: #adb5bd; }
        .signup-link a { color: #38b000; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🏴‍☠️ Cards Zones Club 🏴‍☠️</h2>
        <div id="error-msg" class="error-box">Invalid username, password, or private key. Captcha renewed.</div>

        <label>Username:</label>
        <input type="text" id="login-username" placeholder="Enter username">

        <label>Password:</label>
        <input type="password" id="login-password" placeholder="Enter password">

        <label>36-Digit Private Key:</label>
        <input type="password" id="login-privkey" placeholder="Enter 36-digit private key">

        <label>Captcha Verification:</label>
        <div class="captcha-container">
            <span id="captcha-question">5 + 4</span>
            <button type="button" class="btn-refresh" onclick="generateCaptcha()"> </button>
        </div>
        <input type="text" id="captcha-input" placeholder="Enter captcha code">

        <button onclick="handleLogin()" class="btn-submit">Verify & Continue</button>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script>
        let num1 = 5, num2 = 4, correctAnswer = 9;

        function generateCaptcha() {
            num1 = Math.floor(Math.random() * 10) + 1;
            num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = num1 + num2;
            document.getElementById('captcha-question').innerText = `${num1} + ${num2}`;
            document.getElementById('captcha-input').value = '';
        }

        function handleLogin() {
            let username = document.getElementById('login-username').value.trim();
            let password = document.getElementById('login-password').value.trim();
            let privKey = document.getElementById('login-privkey').value.trim();
            let captchaInput = document.getElementById('captcha-input').value.trim();
            let errorBox = document.getElementById('error-msg');

            if (!username || !password) {
                errorBox.innerText = "Please enter both username and password.";
                errorBox.style.display = 'block';
                generateCaptcha();
                return;
            }

            if (parseInt(captchaInput) !== correctAnswer) {
                errorBox.innerText = "Invalid Captcha verification code. Captcha renewed.";
                errorBox.style.display = 'block';
                generateCaptcha();
                return;
            }

            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch(e) { users = []; }

            let user = users.find(u => u.username && u.username.toLowerCase() === username.toLowerCase());

            if (!user || (password && user.password && user.password !== password)) {
                errorBox.innerText = "Invalid username, password, or private key. Captcha renewed.";
                errorBox.style.display = 'block';
                generateCaptcha();
                return;
            }

            localStorage.setItem('czc_current_user', user.username);
            window.location.href = 'store.html';
        }

        window.onload = function() {
            generateCaptcha();
        };
    </script>
</body>
</html>
