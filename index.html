<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏴‍☠️Cards Zones Club🏴‍☠️ - Secure Gateway</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0d1b2a; color: #ffffff; font-family: Arial, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { background-color: #1b263b; border: 1px solid #415a77; border-radius: 10px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { color: #38b000; text-align: center; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #adb5bd; }
        input { width: 100%; padding: 10px; background: #0d1b2a; border: 1px solid #415a77; color: #fff; border-radius: 6px; font-size: 14px; }
        button { width: 100%; background-color: #38b000; color: #fff; padding: 12px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #2b8a00; }
        .switch-text { text-align: center; margin-top: 15px; font-size: 13px; color: #adb5bd; cursor: pointer; }
        .switch-text span { color: #38b000; font-weight: bold; }
        .error-msg { background: rgba(217,4,41,0.2); border: 1px solid #d90429; color: #ff4d4d; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; display: none; text-align: center; }
        
        .realistic-cards-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            perspective: 1000px;
        }
        .mini-card-realistic {
            width: 75px;
            height: 48px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 8px;
            color: #fff;
            position: relative;
            animation: cardFloat 3s ease-in-out infinite;
        }
        .mini-card-realistic.amex { background: linear-gradient(135deg, #0052D4, #4364F7, #6FB1FC); }
        .mini-card-realistic.mc { background: linear-gradient(135deg, #f12711, #f5af19); }
        .mini-card-realistic.visa { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .card-chip {
            width: 14px;
            height: 10px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 2px;
        }
        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px) rotateX(0deg); }
            50% { transform: translateY(-5px) rotateX(5deg); }
        }
    </style>
    <script>
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</head>
<body>

    <div class="auth-container" id="auth-box">
        <div class="realistic-cards-row">
            <div class="mini-card-realistic amex"><span>AMEX</span><div class="card-chip"></div></div>
            <div class="mini-card-realistic mc"><span>MC</span><div class="card-chip"></div></div>
            <div class="mini-card-realistic visa"><span>VISA</span><div class="card-chip"></div></div>
        </div>
        
        <h2 id="form-title">🏴‍☠️ Cards Zones Club 🏴‍☠️</h2>
        <div id="error-alert" class="error-msg"></div>

        <div id="login-form">
            <div class="form-group">
                <label>Username / Email:</label>
                <input type="text" id="login-user" placeholder="Enter username or email" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="login-pass" placeholder="Enter password" autocomplete="off">
            </div>
            <button onclick="handleLogin()">Secure Login</button>
            <div class="switch-text" onclick="toggleAuthMode()">Don't have an account? <span>Sign Up</span></div>
        </div>

        <div id="signup-form" style="display:none;">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="signup-user" placeholder="Choose username" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="signup-email" placeholder="Enter your email" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="signup-pass" placeholder="Create password" autocomplete="off">
            </div>
            <button onclick="handleSignup()">Create Secure Account</button>
            <div class="switch-text" onclick="toggleAuthMode()">Already have an account? <span>Log In</span></div>
        </div>
    </div>

    <script>
        function initializeDefaultAccounts() {
            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch (e) { users = []; }
            
            let adminIndex = users.findIndex(u => u.username && u.username.toLowerCase() === 'admin');
            let adminData = {
                name: 'admin', username: 'admin', password: 'admin123',
                email: 'treasurerman89@gmail.com', privateKey: 'CZCADMIN9876543210abcdefABCDEF123456',
                balance_usd: 5000.00, is_activated: 1, role: 'Owner',
                tfaEnabled: false, emailVerified: true, activationDate: new Date().toISOString()
            };
            if (adminIndex === -1) { users.push(adminData); } else { users[adminIndex].password = 'admin123'; users[adminIndex].role = 'Owner'; }

            let assistantIndex = users.findIndex(u => u.username && u.username.toLowerCase() === 'williams');
            let assistantData = {
                name: 'williams', username: 'williams', password: 'williams123',
                email: 'williams39@gmail.com', privateKey: 'CZCWILLIAMS9876543210abcdefABCDEF123',
                balance_usd: 1500.00, is_activated: 1, role: 'Personal Assistant',
                tfaEnabled: false, emailVerified: true, activationDate: new Date().toISOString()
            };
            if (assistantIndex === -1) { users.push(assistantData); } else { users[assistantIndex].password = 'williams123'; users[assistantIndex].role = 'Personal Assistant'; }

            localStorage.setItem('czc_users', JSON.stringify(users));
        }

        window.onload = function() {
            initializeDefaultAccounts();
            if (localStorage.getItem('czc_current_user')) {
                window.location.href = 'store.html';
            }
        };

        function toggleAuthMode() {
            let loginForm = document.getElementById('login-form');
            let signupForm = document.getElementById('signup-form');
            let title = document.getElementById('form-title');
            let err = document.getElementById('error-alert');
            err.style.display = 'none';

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                title.innerText = '🏴‍☠️ Cards Zones Club 🏴‍☠️';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                title.innerText = 'Create New Account';
            }
        }

        function showAlert(msg) {
            let err = document.getElementById('error-alert');
            err.innerText = msg;
            err.style.display = 'block';
        }

        function handleLogin() {
            let userInp = document.getElementById('login-user').value.trim();
            let passInp = document.getElementById('login-pass').value.trim();

            if (!userInp || !passInp) {
                showAlert('Please fill in all fields.');
                return;
            }

            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch (e) { users = []; }

            let found = users.find(u => (u.username.toLowerCase() === userInp.toLowerCase() || u.email.toLowerCase() === userInp.toLowerCase()) && u.password === passInp);

            if (found) {
                localStorage.setItem('czc_current_user', found.username);
                window.location.href = 'store.html';
            } else {
                showAlert('Invalid username/email or password.');
            }
        }

        function handleSignup() {
            let userInp = document.getElementById('signup-user').value.trim();
            let emailInp = document.getElementById('signup-email').value.trim();
            let passInp = document.getElementById('signup-pass').value.trim();

            if (!userInp || !emailInp || !passInp) {
                showAlert('Please fill in all fields.');
                return;
            }

            let users = [];
            try { users = JSON.parse(localStorage.getItem('czc_users') || '[]'); } catch (e) { users = []; }

            if (users.some(u => u.username.toLowerCase() === userInp.toLowerCase())) {
                showAlert('Username already taken.');
                return;
            }

            let newUser = {
                name: escapeHtml(userInp),
                username: escapeHtml(userInp),
                email: escapeHtml(emailInp),
                password: passInp,
                privateKey: 'CZC' + Math.random().toString(36).substring(2, 15).toUpperCase() + Math.random().toString(36).substring(2, 15).toUpperCase(),
                balance_usd: 0.00,
                is_activated: 0,
                role: 'Member',
                tfaEnabled: false,
                emailVerified: false
            };

            users.push(newUser);
            localStorage.setItem('czc_users', JSON.stringify(users));
            localStorage.setItem('czc_current_user', newUser.username);
            window.location.href = 'store.html';
        }
    </script>
</body>
</html>
